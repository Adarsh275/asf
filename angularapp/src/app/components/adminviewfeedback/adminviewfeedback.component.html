<div class="container">
    <h2>Feedback Details🤩</h2>
    <table class="table" *ngIf="feedbacks.length > 0; else noData">
      <thead>
        <tr>
          <th>S.No</th>
          <th>User Name</th>
          <th>FeedbackText</th>
          <th class="date-column">Posted Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let feedback of feedbacks; let i = index">
          <td>{{i + 1}}</td>
          <td>{{feedback.user.username}}</td>
          <td>{{feedback.feedbackText}}</td>
          <td>{{feedback.date | date: "dd-MM-yyyy"}}</td>
          <td><button class="btn btn-info" (click)="showProfile(feedback)">Show Profile</button></td>
        </tr>
      </tbody>
    </table>
    <ng-template #noData>
      <p>No data found</p>
    </ng-template>
   
    <div class="popup-overlay" *ngIf="user">
      <div class="popup-content">
        <h3>User Details:</h3>
        <p><strong>Email:</strong> {{user.email}}</p>
        <p><strong>User Name:</strong> {{user.username}}</p>
        <p><strong>Mobile Number:</strong> {{user.mobileNumber}}</p>
        <button class="btn-secondary" (click)="closeProfile()">Close</button>
      </div>
    </div>
  </div>
