#application-name
spring-application.name = Book-Heaven


# DataSource Config
spring.datasource.url=jdbc:mysql://localhost/appdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=examly
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# SQL Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI Config
enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
springdoc.swagger-ui.path=/api-docs
spring.servlet.multipart.max-request-size=8MB

# Logger Config
logging.file.name=logs/app.log
logging.file.path=logs
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.examly.springapp=TRACE

# JWT Config
spring.security.jwt.secret-key=123456781234567812345678123456781234567812345678

# Server Config
server.port:8080
